name: Build RotaAi Android

on:
  workflow_dispatch:
  push:
    branches:
      - codex/rotaai-android-avaliacoes
    paths:
      - "android-avaliador/**"
      - ".github/workflows/build-rotaai-android.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android-avaliador/**"
      - ".github/workflows/build-rotaai-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode RotaAi automation
        working-directory: android-avaliador
        run: |
          mkdir -p decoded
          python - <<'PY'
          import base64
          import gzip
          import pathlib

          asset = pathlib.Path("app/src/main/assets/rotaai.js")
          decoded = gzip.decompress(base64.b64decode(asset.read_text().strip())).decode("utf-8")
          pathlib.Path("decoded/rotaai.js").write_text(decoded, encoding="utf-8")
          PY

      - name: Check RotaAi syntax
        working-directory: android-avaliador
        run: node --check decoded/rotaai.js

      - name: Check generator syntax
        working-directory: android-avaliador
        run: node --check app/src/main/assets/generator.js

      - name: Upload decoded automation for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotaai-decoded-diagnostic
          path: android-avaliador/decoded/rotaai.js
          if-no-files-found: ignore
          retention-days: 3

      - name: Test pending passenger filter
        working-directory: android-avaliador
        run: node tests/pending-review-filter.test.js

      - name: Test casual review generator
        working-directory: android-avaliador
        run: node tests/generator-casual.test.js

      - name: Build debug APK
        working-directory: android-avaliador
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK archive
        working-directory: android-avaliador
        run: unzip -t app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rotaai-avaliador-android
          path: android-avaliador/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
