plugins {
    id 'com.android.application'
}

def ciRunNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def stableKeystore = file("$rootDir/keystore/rotaai-internal-update.jks")
def stableStorePassword = System.getenv('ROTAI_STORE_PASSWORD') ?: 'android'
def stableKeyPassword = System.getenv('ROTAI_KEY_PASSWORD') ?: 'android'

android {
    namespace 'br.com.rotaai.avaliador'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.rotaai.avaliador'
        minSdk 26
        targetSdk 35
        versionCode 600000 + ciRunNumber
        versionName '0.6.5'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        stableInternal {
            storeFile stableKeystore
            storePassword stableStorePassword
            keyAlias 'androiddebugkey'
            keyPassword stableKeyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.stableInternal
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            signingConfig signingConfigs.stableInternal
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
